<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Games - GameZone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f1a;
            min-height: 100vh;
        }

        .search-page-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .search-header {
            background: rgba(15, 15, 26, 0.95);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #667eea;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .search-header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .page-title {
            color: #667eea;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .search-input-wrapper {
            position: relative;
            width: 400px;
        }

        .search-input {
            padding: 0.8rem 1rem 0.8rem 3rem;
            background: #1a1a2e;
            border: 2px solid #667eea;
            border-radius: 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4);
        }

        .search-input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 1.1rem;
        }

        .search-content {
            flex: 1;
            padding: 3rem 2rem;
        }

        .search-results {
            max-width: 1200px;
            margin: 0 auto;
        }

        .results-title {
            color: #667eea;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Game Card - Same as index.html */
        .result-card {
            background: #1a1a2e;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .result-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .result-image {
            height: 200px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            transition: transform 0.3s;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
            border-radius: 15px 15px 0 0;
            background-color: #0f0f1a;
        }

        .result-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            transition: opacity 0.3s;
            z-index: 1;
        }

        .result-card:hover .result-image::before {
            opacity: 0;
        }

        .result-image i {
            position: relative;
            z-index: 2;
            transition: transform 0.3s;
        }

        .result-card:hover .result-image i {
            transform: scale(1.1);
        }

        .result-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .game-category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 3;
            backdrop-filter: blur(5px);
        }

        .result-info {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .result-info h3 {
            color: #667eea;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        /* ✅ FIXED PLAY BUTTON */
        .play-btn {
            width: 100%;
            display: block;
            padding: 0.8rem 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            box-sizing: border-box;
        }

        .play-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .no-results {
            text-align: center;
            padding: 5rem 2rem;
        }

        .no-results i {
            font-size: 5rem;
            color: #667eea;
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }

        .no-results p {
            font-size: 1.5rem;
            color: #b0b0b0;
        }

        .search-placeholder {
            text-align: center;
            padding: 5rem 2rem;
        }

        .search-placeholder i {
            font-size: 6rem;
            color: #667eea;
            margin-bottom: 2rem;
            opacity: 0.3;
        }

        .search-placeholder h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .search-placeholder p {
            color: #b0b0b0;
            font-size: 1.2rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #667eea;
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* ✅ RESPONSIVE BUTTON */
        @media (max-width: 768px) {
            .search-header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .search-header-left {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .search-input-wrapper {
                width: 100%;
            }

            .page-title {
                font-size: 1.2rem;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .play-btn {
                padding: 0.9rem 1rem;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="search-page-container">
        <div class="search-header">
            <div class="search-header-left">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
                <h1 class="page-title">
                    <i class="fas fa-search"></i> Search Games
                </h1>
            </div>
            <div class="search-input-wrapper">
                <i class="fas fa-search search-input-icon"></i>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="Search games by name..."
                    onkeyup="handleSearch(event)"
                    autofocus
                >
            </div>
        </div>

        <div class="search-content">
            <div class="search-results" id="searchResults">
                <div class="search-placeholder">
                    <i class="fas fa-search"></i>
                    <h2>Search for Games</h2>
                    <p>Type a game name to find games</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA8D1Q6g_FNJYaFB2B4fIry1jGR2ArE9J8",
            authDomain: "artonix-1fa99.firebaseapp.com",
            projectId: "artonix-1fa99",
            storageBucket: "artonix-1fa99.firebasestorage.app",
            messagingSenderId: "661275750667",
            appId: "1:661275750667:web:7cc2f54dc5fb47a573b20e",
            measurementId: "G-D227P6KRDZ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global variables
        let allGames = [];
        let gamesLoaded = false;

        // Load all games from Firebase
        async function loadAllGames() {
            if (gamesLoaded) return;

            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p style="margin-top: 1rem;">Loading games...</p>
                </div>
            `;

            try {
                const q = query(collection(db, 'games'), orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);
                
                allGames = [];
                querySnapshot.forEach((doc) => {
                    allGames.push(doc.data());
                });

                gamesLoaded = true;
                showPlaceholder();
                console.log('🎮 Loaded', allGames.length, 'games for search');

            } catch (error) {
                console.error('Error loading games:', error);
                searchResults.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error loading games</h3>
                        <p>Please refresh the page</p>
                    </div>
                `;
            }
        }

        // Make functions global
        window.handleSearch = (event) => {
            const query = event.target.value.toLowerCase().trim();
            
            if (query.length === 0) {
                showPlaceholder();
                return;
            }
            
            if (query.length >= 2) {
                searchGames(query);
            }
        };

        window.searchGames = (searchQuery) => {
            if (!gamesLoaded) {
                loadAllGames().then(() => {
                    performSearch(searchQuery);
                });
            } else {
                performSearch(searchQuery);
            }
        };

        function performSearch(searchQuery) {
            const filteredGames = allGames.filter(game => 
                game.name.toLowerCase().includes(searchQuery) ||
                (game.description && game.description.toLowerCase().includes(searchQuery)) ||
                game.category.toLowerCase().includes(searchQuery)
            );
            
            if (filteredGames.length > 0) {
                showResults(filteredGames, searchQuery);
            } else {
                showNoResults(searchQuery);
            }
        }

        window.showResults = (games, searchQuery) => {
            const searchResults = document.getElementById('searchResults');
            let html = `
                <h2 class="results-title">
                    <i class="fas fa-check-circle"></i> 
                    Found ${games.length} game${games.length > 1 ? 's' : ''} for "${searchQuery}"
                </h2>
                <div class="results-grid">
            `;
            
            games.forEach(game => {
                const hasImage = game.imageUrl && game.imageUrl.trim() !== '';
                
                html += `
                    <div class="result-card" onclick="playGame('${game.name}', '${game.gameUrl}', '${game.description}', '${game.imageUrl}', '${game.category}')">
                        <div class="result-image" ${hasImage ? `style="background-image: url('${game.imageUrl}');"` : ''}>
                            <span class="game-category-badge">${game.category}</span>
                            <i class="fas fa-gamepad"></i>
                        </div>
                        <div class="result-info">
                            <h3>${game.name}</h3>
                            <button class="play-btn" onclick="event.stopPropagation(); playGame('${game.name}', '${game.gameUrl}', '${game.description}', '${game.imageUrl}', '${game.category}')">
                                <i class="fas fa-play"></i> Play Now
                            </button>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            searchResults.innerHTML = html;
        };

        window.showNoResults = (searchQuery) => {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-search"></i>
                    <h3>No games found for "${searchQuery}"</h3>
                    <p>Try searching with different keywords</p>
                </div>
            `;
        };

        window.showPlaceholder = () => {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = `
                <div class="search-placeholder">
                    <i class="fas fa-search"></i>
                    <h2>Search for Games</h2>
                    <p>Type a game name to find games</p>
                </div>
            `;
        };

        window.playGame = (gameName, gameUrl, gameDescription, imageUrl, category) => {
            console.log('Playing game:', gameName, 'URL:', gameUrl);
            showNotification('🎮 Opening ' + gameName + '...');
            
            if (gameUrl && gameUrl !== 'undefined') {
                const gameData = {
                    name: gameName,
                    description: gameDescription,
                    gameUrl: gameUrl,
                    imageUrl: imageUrl,
                    category: category
                };
                localStorage.setItem('currentGame', JSON.stringify(gameData));
                window.location.href = 'game.html';
            } else {
                showNotification('❌ Game URL not available!');
            }
        };

        window.showNotification = (message) => {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 80px;
                right: 20px;
                background: linear-gradient(135deg, #667eea, #764ba2);
                color: white;
                padding: 1rem 2rem;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                z-index: 10000;
                animation: slideIn 0.3s ease;
                font-family: 'Poppins', sans-serif;
                font-weight: 500;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        };

        // Load games on page load
        loadAllGames();

        console.log('🎮 GameZone Search - Firebase Connected!');
    </script>

    <script>
        // Add animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(400px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(400px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
